name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -f ./Dockerfile -t catnip:${{ steps.vars.outputs.sha_short }} -t catnip:latest .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag catnip:${{ steps.vars.outputs.sha_short }} ${{ secrets.DOCKER_USER }}/catnip:${{ steps.vars.outputs.sha_short }}
          docker tag catnip:latest ${{ secrets.DOCKER_USER }}/catnip:latest
          docker push ${{ secrets.DOCKER_USER }}/catnip:${{ steps.vars.outputs.sha_short }}
          docker push ${{ secrets.DOCKER_USER }}/catnip:latest